[package]
name = "seedcrypt-recover"
version = "0.1.0"
edition = "2021"
description = "Fast offline BIP39 seed recovery tool with address validation. btcrecover-equivalent in Rust."
license = "MIT"
repository = "https://github.com/femto7/seedcrypt-recover"
readme = "README.md"
keywords = ["bitcoin", "ethereum", "seed", "recovery", "bip39"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "seedcrypt-recover"
path = "src/main.rs"

[lib]
name = "seedcrypt_recover"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
hmac = "0.12"
pbkdf2 = "0.12"
bs58 = { version = "0.5", features = ["check"] }
bech32 = "0.11"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
rayon = "1.10"
crossbeam-channel = "0.5"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
